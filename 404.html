<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Rishabh Sharma</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .not-found {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 96px 24px;
    }
    .not-found__code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 700;
      color: var(--color-accent);
      margin: 0;
      line-height: 1;
    }
    .not-found__message {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      margin: 16px 0 32px;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <p class="not-found__code">404</p>
    <p class="not-found__message">this page went <span class="highlight">off the roadmap</span></p>
    <a href="/" class="btn btn--primary">Back to the homepage</a>
  </div>
</body>
</html>
